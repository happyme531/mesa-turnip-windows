name: Turnip Windows ARM64

on:
  push:
    branches: [turnip-windows-gsl-dev]
  pull_request:
    branches: [turnip-windows-gsl-dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: turnip-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-11-vs2026-arm
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Python ARM64
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
          architecture: arm64
          cache: pip
          cache-dependency-path: windows/turnip/requirements-build.txt
      - name: Build, CPU regressions and package
        run: ./windows/turnip/Build.ps1 -Jobs 4
      - name: Upload driver package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: turnip-windows-arm64-${{ github.sha }}
          path: dist-turnip-windows.zip
          if-no-files-found: error
          retention-days: 30
      - name: Upload build diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: turnip-build-diagnostics
          path: |
            build-turnip-windows-arm64/meson-logs/
          retention-days: 7
